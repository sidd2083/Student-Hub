services:
  - type: web
    name: student-hub-api
    runtime: node
    buildCommand: npm install -g pnpm@10.26.1 && pnpm install && pnpm --filter @workspace/student-hub run build && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # Set automatically by Render — do NOT override
      - key: PORT
        generateValue: false

      - key: NODE_ENV
        value: production

      # ── Required secrets — paste values in Render dashboard ──────────────────
      # Firebase Admin SDK (for study-time saves, leaderboard, etc.)
      # Get it: Firebase Console → Project Settings → Service Accounts → Generate new private key
      # Paste the entire JSON as a single line (minified)
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # Gemini API key for Nep AI (/api/ai/chat)
      # Get it: aistudio.google.com → Get API Key
      - key: GEMINI_API_KEY
        sync: false

      # ── Optional ─────────────────────────────────────────────────────────────
      # Restrict CORS to your frontend domain for extra security.
      # Example: https://student-hub.vercel.app
      # Leave blank to allow all origins (fine for most setups).
      - key: CORS_ORIGIN
        sync: false

      # Log level: trace | debug | info | warn | error (default: info)
      - key: LOG_LEVEL
        value: info

      # Firebase public config — needed by the SSR meta-injection route.
      # Copy these from your Firebase project console (they are already public).
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
