services:
  - type: web
    name: student-hub-api
    runtime: node
    rootDir: artifacts/api-server
    buildCommand: npm install -g pnpm@10.26.1 && pnpm install && pnpm run build
    startCommand: node --enable-source-maps ./dist/index.mjs
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # Set automatically by Render — do NOT override
      - key: PORT
        generateValue: false

      - key: NODE_ENV
        value: production

      # ── Required secrets — paste values in Render dashboard ──────────────────
      # Firebase Admin SDK (for study-time saves, leaderboard, etc.)
      # Get it: Firebase Console → Project Settings → Service Accounts → Generate new private key
      # Paste the entire JSON as a single line (minified)
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # OpenAI key for Nep AI (/api/ai/chat)
      # Get it: platform.openai.com → API keys
      - key: OPENAI_API_KEY
        sync: false

      # ── Optional ─────────────────────────────────────────────────────────────
      # Restrict CORS to your Vercel domain for extra security.
      # Example: https://student-hub.vercel.app
      # Leave blank to allow all origins (fine for most setups).
      - key: CORS_ORIGIN
        sync: false

      # Override OpenAI base URL if using a proxy / Azure OpenAI
      - key: OPENAI_BASE_URL
        sync: false

      # Log level: trace | debug | info | warn | error (default: info)
      - key: LOG_LEVEL
        value: info
